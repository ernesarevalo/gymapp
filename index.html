<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gymapp - Workout Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>gymapp</h1>
            <button id="reset-day-btn" class="reset-btn" title="Reiniciar series del día">
                <i class="ph ph-arrows-counter-clockwise"></i> Reiniciar Día
            </button>
        </div>
        <nav id="tabs-container"></nav>
    </header>
    
    <main id="content-container">
        <!-- Las tarjetas se inyectan vía JS -->
    </main>

    <!-- Widget Mascotita Flotante -->
    <div id="mascot-container" class="mascot-container">
        <div id="mascot-speech" class="mascot-speech">¡A darle con todo hoy! 💪</div>
        <div id="mascot-icon" class="mascot-icon">
            <svg viewBox="0 0 64 64" width="48" height="48" fill="none">
                <!-- Cuerpo fantasmita/gatito pastel -->
                <path d="M32 8C20.954 8 12 16.954 12 28v20c0 2.2 2.6 3.5 4.4 2.2L23 45l5.6 3.7c2.1 1.4 4.7 1.4 6.8 0L41 45l6.6 5.2c1.8 1.3 4.4 0 4.4-2.2V28C52 16.954 43.046 8 32 8z" fill="#E8D5F5"/>
                <!-- Ojos -->
                <circle cx="25" cy="26" r="3" fill="#4A404A"/>
                <circle cx="39" cy="26" r="3" fill="#4A404A"/>
                <!-- Sonrisa -->
                <path d="M28 32c2 2 6 2 8 0" stroke="#4A404A" stroke-width="2" stroke-linecap="round"/>
                <!-- Rubor pastel -->
                <circle cx="20" cy="30" r="2.5" fill="#F3C4D8" opacity="0.8"/>
                <circle cx="44" cy="30" r="2.5" fill="#F3C4D8" opacity="0.8"/>
            </svg>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
