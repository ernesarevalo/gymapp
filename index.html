<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gymapp - Workout Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Librería para generar el PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>gymapp</h1>
            <div class="header-actions">
                <button id="pdf-btn" class="reset-btn" title="Descargar rutina limpia en PDF">
                    <i class="ph ph-file-pdf"></i> PDF
                </button>
                <button id="theme-toggle-btn" class="reset-btn" title="Alternar Modo Oscuro/Claro">
                    <i class="ph ph-moon"></i>
                </button>
                <button id="reset-day-btn" class="reset-btn" title="Reiniciar series del día">
                    <i class="ph ph-arrows-counter-clockwise"></i> Reiniciar
                </button>
            </div>
        </div>
        <nav id="tabs-container"></nav>
    </header>
    
    <main id="content-container">
        <!-- Las tarjetas se inyectan vía JS -->
    </main>

    <!-- Widget Mascotita Flotante -->
    <div id="mascot-container" class="mascot-container">
        <div id="mascot-speech" class="mascot-speech">¡A darle con todo hoy! 💪</div>
        <div id="mascot-icon" class="mascot-icon">
            <!-- El SVG se inyecta aleatoriamente vía JS -->
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
